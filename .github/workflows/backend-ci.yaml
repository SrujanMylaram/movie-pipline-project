name: Backend Continuous Integration

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  lint:
    name: Lint Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pipenv
        run: python -m pip install pipenv

      - name: Install dependencies
        run: python -m pipenv install --dev

      - name: Run lint
        run: python -m pipenv run lint


  test:
    name: Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pipenv
        run: python -m pip install pipenv

      - name: Install dependencies
        run: python -m pipenv install --dev

      - name: Run tests
        run: python -m pipenv run test


  build:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: starter/backend
        run: |
          docker build \
            -t mp-backend:ci .